name: Android Release Tag

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Get Android version
        id: version
        run: |
          VERSION=$(awk -F'"' '/versionName/ { print $2; exit }' frontend/android/app/build.gradle)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "apk_name=MediaTree-App-$VERSION.apk" >> $GITHUB_OUTPUT
          echo "checksum_name=MediaTree-App-$VERSION.apk.sha256" >> $GITHUB_OUTPUT

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is required for signed release builds." >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/mediatree-release.jks

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: /tmp/mediatree-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd frontend/android
          ./gradlew assembleRelease

      - name: Create tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            CURRENT_TAG_COMMIT=$(git rev-parse "$VERSION^{commit}")
            CURRENT_HEAD_COMMIT=$(git rev-parse HEAD)
            if [ "$CURRENT_TAG_COMMIT" != "$CURRENT_HEAD_COMMIT" ]; then
              echo "Tag $VERSION already exists at $CURRENT_TAG_COMMIT, not $CURRENT_HEAD_COMMIT." >&2
              exit 1
            fi
          else
            git tag "$VERSION" "${{ github.sha }}"
            git push origin "$VERSION"
          fi

      - name: Name APK and generate checksum
        run: |
          cd frontend/android/app/build/outputs/apk/release
          cp app-release.apk "${{ steps.version.outputs.apk_name }}"
          sha256sum "${{ steps.version.outputs.apk_name }}" > "${{ steps.version.outputs.checksum_name }}"

      - name: Extract release notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CONTENT=$(awk -v ver="$VERSION" '
            BEGIN { found=0; in_notes=0; saw_notes=0; fallback="" }
            /^## / {
              if (found) exit
              if ($0 ~ ver) { found=1; next }
            }
            found {
              if ($0 ~ /^<!-- release-notes:start -->/) { in_notes=1; saw_notes=1; next }
              if ($0 ~ /^<!-- release-notes:end -->/) { in_notes=0; next }
              if (in_notes) { print; next }
              if (!saw_notes) { fallback = fallback $0 "\n" }
            }
            END {
              if (!saw_notes) {
                printf "%s", fallback
              }
            }
          ' CHANGELOG_zh-CN.md)
          echo "$CONTENT" > /tmp/release_body.md

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          body_path: /tmp/release_body.md
          make_latest: true
          files: |
            frontend/android/app/build/outputs/apk/release/${{ steps.version.outputs.apk_name }}
            frontend/android/app/build/outputs/apk/release/${{ steps.version.outputs.checksum_name }}

      - name: Notify Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          VERSION: ${{ steps.version.outputs.version }}
          APK_NAME: ${{ steps.version.outputs.apk_name }}
          APK_PATH: frontend/android/app/build/outputs/apk/release/${{ steps.version.outputs.apk_name }}
          CHECKSUM_PATH: frontend/android/app/build/outputs/apk/release/${{ steps.version.outputs.checksum_name }}
        run: bash .github/scripts/notify-telegram-release.sh
