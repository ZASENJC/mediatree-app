name: Android Release Tag

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Get Android version
        id: version
        run: |
          VERSION=$(awk -F'"' '/versionName/ { print $2; exit }' frontend/android/app/build.gradle)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build debug APK
        run: |
          cd frontend/android
          ./gradlew assembleDebug

      - name: Force update tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f ${{ steps.version.outputs.version }} ${{ github.sha }}
          git push origin ${{ steps.version.outputs.version }} --force

      - name: Extract release notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CONTENT=$(awk -v ver="$VERSION" '
            BEGIN { found=0; buf="" }
            /^## / {
              if (found) exit
              if ($0 ~ ver) { found=1; next }
            }
            found { buf = buf $0 "\n" }
            END { print buf }
          ' CHANGELOG_zh-CN.md | head -n -1)
          echo "$CONTENT" > /tmp/release_body.md

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          body_path: /tmp/release_body.md
          make_latest: true
          files: |
            frontend/android/app/build/outputs/apk/debug/app-debug.apk
