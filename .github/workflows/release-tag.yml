name: Android Release Tag

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Get Android version
        id: version
        run: |
          VERSION=$(awk -F'"' '/versionName/ { print $2; exit }' frontend/android/app/build.gradle)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is required for signed release builds." >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/mediatree-release.jks

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: /tmp/mediatree-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd frontend/android
          ./gradlew assembleRelease

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.version }} ${{ github.sha }}
          git push origin ${{ steps.version.outputs.version }}

      - name: Generate checksum
        run: |
          cd frontend/android/app/build/outputs/apk/release
          sha256sum app-release.apk > app-release.apk.sha256

      - name: Extract release notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CONTENT=$(awk -v ver="$VERSION" '
            BEGIN { found=0; buf="" }
            /^## / {
              if (found) exit
              if ($0 ~ ver) { found=1; next }
            }
            found { buf = buf $0 "\n" }
            END { print buf }
          ' CHANGELOG_zh-CN.md | head -n -1)
          echo "$CONTENT" > /tmp/release_body.md

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          body_path: /tmp/release_body.md
          make_latest: true
          files: |
            frontend/android/app/build/outputs/apk/release/app-release.apk
            frontend/android/app/build/outputs/apk/release/app-release.apk.sha256
